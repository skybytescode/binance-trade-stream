<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live trades</title>
<style>
  :root { --bg:#0f1420; --panel:#161d2c; --line:#2a3448; --text:#e6ebf5; --muted:#8b97ad; --buy:#3fb68b; --sell:#ff7b72; }
  html, body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 "Inter","Segoe UI",system-ui,sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:28px 16px; }
  h1 { margin:0 0 4px; font-size:24px; font-weight:650; }
  .sub { color:var(--muted); margin-bottom:22px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .sym { font-weight:700; font-size:17px; display:flex; justify-content:space-between; }
  .price { font:600 26px/1.2 "JetBrains Mono",ui-monospace,monospace; margin:8px 0 2px; }
  .up { color:var(--buy); } .down { color:var(--sell); }
  .row { display:flex; justify-content:space-between; gap:12px; color:var(--muted); font-size:13px; margin-top:4px; }
  .row b { color:var(--text); font-weight:600; font-family:"JetBrains Mono",ui-monospace,monospace; }
  .bar { height:8px; border-radius:4px; background:var(--sell); margin:12px 0 4px; overflow:hidden; }
  .bar > div { height:100%; background:var(--buy); }
  .legend { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Live trades from Binance</h1>
  <div class="sub" id="sub">connecting…</div>
  <div class="grid" id="grid"></div>
</main>
<script>
  const fmt = (n, d) => n.toLocaleString("en-US", {minimumFractionDigits: d, maximumFractionDigits: d});
  const digits = p => p >= 100 ? 2 : p >= 1 ? 4 : 6;
  const prev = {};
  async function refresh() {
    try {
      const r = await fetch("/api/stats");
      const data = await r.json();
      document.getElementById("sub").textContent =
        `Rolling ${data.window} window · ${data.stats.reduce((n, s) => n + s.trades, 0)} trades · updated ${new Date(data.as_of).toLocaleTimeString()}`;
      document.getElementById("grid").innerHTML = data.stats.map(s => {
        const buy = s.volume ? 100 * s.buy_volume / s.volume : 0;
        const dir = prev[s.symbol] === undefined ? "" : s.last >= prev[s.symbol] ? "up" : "down";
        prev[s.symbol] = s.last;
        const d = digits(s.last);
        return `<div class="card">
          <div class="sym"><span>${s.symbol}</span><span class="row">${s.trades} trades</span></div>
          <div class="price ${dir}">${fmt(s.last, d)}</div>
          <div class="row"><span>VWAP</span><b>${fmt(s.vwap, d)}</b></div>
          <div class="row"><span>High / Low</span><b>${fmt(s.high, d)} / ${fmt(s.low, d)}</b></div>
          <div class="row"><span>Volume</span><b>${fmt(s.volume, 4)}</b></div>
          <div class="bar"><div style="width:${buy.toFixed(1)}%"></div></div>
          <div class="legend"><span class="up">buy ${buy.toFixed(0)}%</span><span class="down">sell ${(100 - buy).toFixed(0)}%</span></div>
        </div>`;
      }).join("");
    } catch (e) {
      document.getElementById("sub").textContent = "disconnected, retrying…";
    }
  }
  refresh();
  setInterval(refresh, 1000);
</script>
</body>
</html>
